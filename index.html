<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Box Workout</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:20px 16px 60px}.muted{color:#6b6b6b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.row{background:white;border:1px solid #ddd;border-radius:18px;padding:16px}.card{min-height:105px;text-align:left}.card b{display:block;font-size:18px;margin-top:8px}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;background:#171717;color:white}.outline{background:white;color:#171717;border:1px solid #aaa}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.screen{display:none}.screen.on{display:block}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.plus{width:44px;height:44px;border-radius:12px;border:1px solid #bbb;background:white;font-size:20px}.pill{display:inline-block;background:#eee;border-radius:999px;padding:6px 10px;font-size:13px}.demo{height:210px;border-radius:20px;background:#eee;display:grid;place-items:center;margin:14px 0}.demo .person{font-size:72px;animation:move 1.5s ease-in-out infinite alternate}@keyframes move{to{transform:translateY(-12px)}}.footer{position:sticky;bottom:10px;background:rgba(247,247,245,.94);padding:10px 0}.warn{padding:12px;border:1px solid #d2a800;border-radius:12px}.progress{height:8px;background:#ddd;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#171717}.timer{font-size:38px;font-weight:800;text-align:center}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main id="app">
<section id="home" class="screen on"><p class="muted">BOX WORKOUT · V1</p><h1>Cosa alleniamo?</h1><p class="muted">Manubri · tappetino · cyclette · 3×10</p><div id="groups" class="grid"></div><div class="footer top"><div><b id="count">0 esercizi</b><div id="estimate" class="muted">0 min stimati</div></div><button id="planBtn" class="btn" disabled>Allenamento</button></div></section>
<section id="catalog" class="screen"><button class="outline btn" id="backHome">← Home</button><h1 id="groupName"></h1><div id="exerciseList" class="list"></div><div class="footer"><button id="planBtn2" class="btn" style="width:100%">Il mio allenamento</button></div></section>
<section id="detail" class="screen"><button class="outline btn" id="backCatalog">← Esercizi</button><p id="detailGroup" class="muted"></p><h1 id="detailName"></h1><div class="demo"><span class="person">🏋️</span></div><div><span class="pill">3 serie</span> <span class="pill">10 reps</span> <span class="pill">45 s pausa</span></div><h3>Esecuzione</h3><p id="cue"></p><h3>Evita</h3><p id="avoid" class="muted"></p><button id="toggle" class="btn" style="width:100%"></button></section>
<section id="plan" class="screen"><button class="outline btn" id="backPlan">← Modifica</button><h1>Allenamento di oggi</h1><p id="planEstimate" class="muted"></p><div id="chosen" class="list"></div><p id="warning" class="warn" hidden>La selezione rischia di superare 50 minuti.</p><div class="footer"><button id="start" class="btn" style="width:100%">START</button></div></section>
<section id="train" class="screen"><div class="top"><span id="position"></span><b id="clock">00:00</b></div><div class="progress"><i id="progress" style="width:0"></i></div><p id="trainGroup" class="muted"></p><h1 id="trainName"></h1><div class="demo"><span class="person">🏋️</span></div><p id="trainCue"></p><h2 id="series"></h2><button id="done" class="btn" style="width:100%">✓ Serie completata</button><div id="restBox" class="card" hidden><div class="muted" style="text-align:center">RECUPERO</div><div id="restTime" class="timer">45</div><button id="skipRest" class="outline btn" style="width:100%">Salta pausa</button></div><button id="skip" class="outline btn" style="width:100%;margin-top:10px">Salta esercizio</button></section>
<section id="end" class="screen" style="text-align:center"><div style="font-size:64px">✓</div><h1>Allenamento completato</h1><p id="endTime"></p><button id="again" class="btn">Nuovo allenamento</button></section>
</main><script>
const D={Petto:[['Floor Press','Schiena a terra, gomiti circa 45°. Spingi verticale e scendi controllato.','Non inarcare la lombare.'],['Floor Fly','Apri controllando il peso e richiudi sopra il petto.','Non forzare la spalla in basso.'],['Push-up','Corpo in linea, scendi controllato e spingi il pavimento.','Non far cedere il bacino.'],['Pullover','Porta il manubrio dietro la testa e ritorna mantenendo il tronco stabile.','Non compensare con la lombare.']],Braccia:[['Dumbbell Curl','Gomiti fermi ai fianchi; fletti e torna lentamente.','Niente slancio del busto.'],['Hammer Curl','Palmi uno verso l’altro; gomiti fermi e movimento controllato.','Non portare i gomiti avanti.'],['Concentration Curl','Gomito stabile contro la coscia; porta il peso verso la spalla.','Non muovere il braccio superiore.'],['Triceps Extension','In ginocchio; piega ed estendi i gomiti mantenendo il tronco stabile.','Non inarcare la lombare.']],Spalle:[['Alzate laterali','Solleva lateralmente fino circa alle spalle.','Non usare slancio.'],['Alzate frontali','Solleva davanti fino circa alle spalle e torna piano.','Non inarcare la schiena.'],['Shoulder Press in ginocchio','Addome attivo; spingi il manubrio sopra la testa.','Non inclinare il tronco.'],['Shrug','Porta le spalle verticalmente verso le orecchie e rilassa.','Non ruotare le spalle.']],Schiena:[['One-Arm Row','Schiena neutra; porta il gomito verso il fianco.','Non ruotare il busto.'],['Pullover','Movimento lento dietro la testa e ritorno.','Non forzare il movimento.'],['Shrug','Solleva le spalle verticalmente mantenendo le braccia distese.','Non fare circonduzioni.']],Gambe:[['Squat','Bacino indietro, ginocchia allineate ai piedi, risali controllato.','Non forzare una profondità dolorosa.'],['Goblet Squat','Peso al petto; scendi controllato e risali mantenendo il busto stabile.','Ginocchia non verso l’interno.'],['Calf Raise','Sali sulle punte, breve pausa, scendi lentamente.','Non rimbalzare.'],['Calf Raise con manubri','Manubri ai lati; sali sulle punte mantenendo il corpo verticale.','Non usare slancio.']],Addome:[['Crunch','Solleva le scapole contraendo l’addome e torna lentamente.','Non tirare il collo.'],['Heel Taps','Spalle sollevate; raggiungi alternativamente i talloni.','Movimento controllato.'],['Plank','Corpo in linea e addome attivo.','Non far cedere il bacino.'],['Leg Raises','Alza e abbassa le gambe mantenendo controllo lombare.','Fermati prima che la lombare si sollevi.']]};
const icons={Petto:'◫',Braccia:'💪',Spalle:'↟',Schiena:'↩',Gambe:'🦵',Addome:'◆'},$=x=>document.querySelector(x),screens=[...document.querySelectorAll('.screen')];let selected=JSON.parse(localStorage.getItem('boxWorkoutSelection')||'[]'),group='',detail=null,idx=0,setN=1,t0=0,timer,restTimer;function show(id){screens.forEach(x=>x.classList.toggle('on',x.id===id))}function key(g,n){return g+'|'+n}function has(g,n){return selected.some(x=>x.key===key(g,n))}function save(){localStorage.setItem('boxWorkoutSelection',JSON.stringify(selected));update()}function update(){let n=selected.length,m=Math.round(n*5.5);$('#count').textContent=n+' esercizi';$('#estimate').textContent=m+' min stimati';$('#planBtn').disabled=!n}function toggle(g,e){let k=key(g,e[0]),i=selected.findIndex(x=>x.key===k);if(i>=0)selected.splice(i,1);else selected.push({key:k,group:g,name:e[0],cue:e[1],avoid:e[2]});save()}
Object.keys(D).forEach(g=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span style="font-size:28px">'+icons[g]+'</span><b>'+g+'</b><span class="muted">'+D[g].length+' esercizi</span>';b.onclick=()=>openGroup(g);$('#groups').append(b)});function openGroup(g){group=g;$('#groupName').textContent=g;renderCatalog();show('catalog')}function renderCatalog(){let q=$('#exerciseList');q.innerHTML='';D[group].forEach(e=>{let row=document.createElement('div');row.className='row';let a=document.createElement('button');a.className='grow';a.style='border:0;background:none;text-align:left';a.innerHTML='<b>'+e[0]+'</b><div class="muted">3×10 · vedi tecnica</div>';a.onclick=()=>openDetail(group,e);let p=document.createElement('button');p.className='plus';p.textContent=has(group,e[0])?'✓':'+';p.onclick=()=>{toggle(group,e);renderCatalog()};row.append(a,p);q.append(row)})}function openDetail(g,e){detail={group:g,name:e[0],cue:e[1],avoid:e[2]};$('#detailGroup').textContent=g;$('#detailName').textContent=e[0];$('#cue').textContent=e[1];$('#avoid').textContent=e[2];detailBtn();show('detail')}function detailBtn(){$('#toggle').textContent=has(detail.group,detail.name)?'✓ Selezionato':'＋ Aggiungi all’allenamento'}function renderPlan(){let q=$('#chosen');q.innerHTML='';selected.forEach((x,i)=>{let row=document.createElement('div');row.className='row';row.innerHTML='<b>'+(i+1)+'.</b><div class="grow"><b>'+x.name+'</b><div class="muted">'+x.group+' · 3×10</div></div>';let del=document.createElement('button');del.className='plus';del.textContent='×';del.onclick=()=>{selected.splice(i,1);save();renderPlan()};row.append(del);q.append(row)});let m=Math.round(selected.length*5.5);$('#planEstimate').textContent=selected.length+' esercizi · circa '+m+' min';$('#warning').hidden=m<=50;$('#start').disabled=!selected.length;show('plan')}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function renderTrain(){if(idx>=selected.length){clearInterval(timer);clearInterval(restTimer);$('#endTime').textContent='Tempo totale: '+fmt(Math.floor((Date.now()-t0)/1000));show('end');return}let x=selected[idx];$('#position').textContent='Esercizio '+(idx+1)+'/'+selected.length;$('#trainGroup').textContent=x.group;$('#trainName').textContent=x.name;$('#trainCue').textContent=x.cue;$('#series').textContent='Serie '+setN+'/3 · 10 ripetizioni';$('#progress').style.width=((idx+(setN-1)/3)/selected.length*100)+'%'}function start(){idx=0;setN=1;t0=Date.now();timer=setInterval(()=>$('#clock').textContent=fmt(Math.floor((Date.now()-t0)/1000)),1000);show('train');renderTrain()}function rest(){let n=45;$('#restTime').textContent=n;$('#restBox').hidden=false;$('#done').disabled=true;restTimer=setInterval(()=>{n--;$('#restTime').textContent=n;if(n<=0)endRest()},1000)}function endRest(){clearInterval(restTimer);$('#restBox').hidden=true;$('#done').disabled=false;renderTrain()}
$('#backHome').onclick=()=>show('home');$('#planBtn').onclick=renderPlan;$('#planBtn2').onclick=renderPlan;$('#backCatalog').onclick=()=>{renderCatalog();show('catalog')};$('#toggle').onclick=()=>{let e=D[detail.group].find(x=>x[0]===detail.name);toggle(detail.group,e);detailBtn()};$('#backPlan').onclick=()=>show('home');$('#start').onclick=start;$('#done').onclick=()=>{if(setN<3){setN++;rest()}else{idx++;setN=1;renderTrain()}};$('#skipRest').onclick=endRest;$('#skip').onclick=()=>{clearInterval(restTimer);$('#restBox').hidden=true;$('#done').disabled=false;idx++;setN=1;renderTrain()};$('#again').onclick=()=>show('home');update();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
