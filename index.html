<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d12"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Box Workout V3</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7f9;background:#080d12;--bg:#080d12;--card:#111820;--card2:#0d141b;--line:#26323d;--muted:#95a1ad;--green:#55e6a5;--danger:#ff6b61}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0e1820 0,#080d12 42%);min-height:100vh}button{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 98px}.screen{display:none}.screen.on{display:block}.brand{display:flex;gap:12px;align-items:center}.brandmark{font-size:31px;color:var(--green)}h1{font-size:36px;margin:8px 0 4px;line-height:1.05}.sub{color:var(--muted);margin:0 0 20px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:#fff;padding:9px 13px;border-radius:999px}.chip.active{background:#153d30;border-color:#23694f}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:22px 0 10px}.sectionhead h2{margin:0}.list{display:grid;gap:12px}.ex{display:grid;grid-template-columns:128px 1fr 50px;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#111820,#10171e);min-height:112px}.ex.selected{border-color:var(--green);box-shadow:0 0 0 1px rgba(85,230,165,.08) inset}.thumb{height:92px;border-radius:14px;overflow:hidden;background:#0b1117;border:1px solid #1e2a34;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.namebtn{background:none;border:0;color:#fff;text-align:left;padding:0}.namebtn b{font-size:18px}.meta{color:var(--muted);font-size:14px;margin-top:5px}.plus{width:46px;height:46px;border-radius:14px;border:1px solid #34424f;background:#0d141b;color:#fff;font-size:25px}.plus.selected{background:var(--green);color:#07120d;border-color:var(--green)}.topbtn{border:1px solid var(--line);background:transparent;color:#fff;border-radius:17px;padding:12px 15px;font-weight:750}.tag{color:var(--green);font-weight:800;margin-top:22px}.hero{margin-top:18px;border:1px solid var(--line);background:linear-gradient(145deg,#111820,#0d141b);border-radius:22px;padding:14px;position:relative}.humanloop{height:340px;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(circle,#18242d,#0a1016 72%)}.humanloop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:frames 4.5s infinite}.humanloop img:nth-child(1){animation-delay:0s}.humanloop img:nth-child(2){animation-delay:1.5s}.humanloop img:nth-child(3){animation-delay:3s}@keyframes frames{0%,28%{opacity:1;transform:scale(1)}33%,100%{opacity:0;transform:scale(.985)}}.loopbadge{position:absolute;right:14px;bottom:12px;background:rgba(8,13,18,.8);border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--green);font-size:13px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.step{background:#0d141b;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center;font-size:12px;color:var(--muted)}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{background:#17202a;border:1px solid var(--line);padding:7px 11px;border-radius:999px;font-size:13px}.infoGrid{display:grid;grid-template-columns:1fr;gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.panel h3{margin:0 0 12px}.panel ol,.panel ul{padding-left:22px;margin:0}.panel li{margin:9px 0;line-height:1.35}.bad li::marker{color:var(--danger)}.primary{width:100%;border:0;border-radius:17px;padding:15px;background:var(--green);color:#06110c;font-weight:900;font-size:17px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,13,18,.96);border-top:1px solid #1e2933;backdrop-filter:blur(12px);z-index:10}.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:var(--muted);font-size:11px;padding:6px}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--green)}.placeholder{display:grid;place-items:center;height:250px;text-align:center;color:var(--muted);padding:30px}.fav{float:right}.notice{font-size:12px;color:var(--muted);margin-top:8px}@media(min-width:650px){.infoGrid{grid-template-columns:1fr 1fr}.humanloop{height:400px}}
</style></head><body><div class="app">
<section id="library" class="screen on"><div class="brand"><div class="brandmark">🏋</div><div><b style="font-size:22px">Box Workout</b><div class="sub" style="margin:2px 0 0">Il tuo allenamento, sempre con te.</div></div></div><div id="chips" class="chips"></div><div class="sectionhead"><h2 id="title">Braccia</h2><span id="total" class="sub" style="margin:0"></span></div><div id="list" class="list"></div></section>
<section id="detail" class="screen"><button id="back" class="topbtn">← Esercizi</button><button id="fav" class="topbtn fav">☆ Preferito</button><div id="dg" class="tag">Braccia</div><h1 id="dn">Dumbbell Curl</h1><div id="dm" class="sub">3 × 10 · 45 s pausa</div><div id="visual"></div><div class="pills"><span class="pill">3 serie</span><span class="pill">10 reps</span><span class="pill">45 s pausa</span></div><div class="infoGrid"><div class="panel"><h3>☰ Esecuzione</h3><ol id="instructions"></ol></div><div class="panel bad"><h3>⚠ Da evitare</h3><ul id="mistakes"></ul></div></div><div style="height:12px"></div><button id="select" class="primary"></button></section>
<section id="simple" class="screen"><button id="simpleBack" class="topbtn">← Home</button><div class="placeholder"><div><h1 id="simpleTitle"></h1><p>Questa sezione la colleghiamo nelle prossime versioni senza cambiare l'app installata.</p></div></div></section>
</div><nav class="bottom"><div class="bottomin"><button class="nav" data-nav="home"><span>⌂</span>Home</button><button class="nav active" data-nav="exercise"><span>🏋</span>Esercizi</button><button class="nav" data-nav="workout"><span>▶</span>Allenamento</button><button class="nav" data-nav="progress"><span>▥</span>Progressi</button><button class="nav" data-nav="settings"><span>⚙</span>Impostazioni</button></div></nav><script>
const groups=['Tutti','Petto','Braccia','Spalle','Schiena','Gambe','Addome'];
const E=[
{g:'Braccia',n:'Dumbbell Curl',muscle:'Bicipiti',img:'assets/curl-strip.webp',loop:true,steps:['Piedi alla larghezza delle spalle, manubri ai lati.','Mantieni i gomiti fermi vicino al corpo.','Fletti i gomiti portando i manubri verso le spalle.','Contrai i bicipiti in alto senza spostare i gomiti.','Torna lentamente alla posizione iniziale.'],bad:['Non dondolare il busto.','Non staccare i gomiti dai fianchi.','Non usare slancio.','Non salire troppo velocemente.','Mantieni i polsi neutri.']},
{g:'Braccia',n:'Hammer Curl',muscle:'Bicipiti / brachiale',img:'assets/hammer-strip.webp'},
{g:'Braccia',n:'Concentration Curl',muscle:'Bicipiti',img:'assets/concentration-strip.webp'},
{g:'Braccia',n:'Reverse Curl',muscle:'Avambracci',img:'assets/reverse-strip.webp'},
{g:'Braccia',n:'Triceps Extension',muscle:'Tricipiti',img:'assets/triceps-extension-strip.webp'},
{g:'Braccia',n:'Triceps Pushdown',muscle:'Tricipiti',img:'assets/triceps-pushdown-strip.webp'},
{g:'Petto',n:'Dumbbell Floor Press',muscle:'Petto / tricipiti'}, {g:'Petto',n:'Floor Fly',muscle:'Petto'}, {g:'Petto',n:'Push-up',muscle:'Petto / tricipiti'}, {g:'Petto',n:'Pullover a terra',muscle:'Petto / dorsali'},
{g:'Spalle',n:'Alzate laterali',muscle:'Deltoidi'}, {g:'Spalle',n:'Alzate frontali',muscle:'Deltoidi'}, {g:'Spalle',n:'Shoulder Press in ginocchio',muscle:'Spalle'}, {g:'Spalle',n:'Shrug',muscle:'Trapezio'},
{g:'Schiena',n:'One-Arm Row',muscle:'Dorsali'}, {g:'Schiena',n:'Pullover a terra',muscle:'Dorsali'}, {g:'Schiena',n:'Shrug',muscle:'Trapezio'},
{g:'Gambe',n:'Squat',muscle:'Quadricipiti / glutei'}, {g:'Gambe',n:'Goblet Squat',muscle:'Gambe / glutei'}, {g:'Gambe',n:'Calf Raise',muscle:'Polpacci'}, {g:'Gambe',n:'Calf Raise con manubri',muscle:'Polpacci'},
{g:'Addome',n:'Crunch',muscle:'Addome'}, {g:'Addome',n:'Heel Taps',muscle:'Obliqui'}, {g:'Addome',n:'Plank',muscle:'Core'}, {g:'Addome',n:'Leg Raises',muscle:'Addome'}];
let group='Braccia',current=null,selected=JSON.parse(localStorage.getItem('bw-v3-selected')||'[]'),favs=JSON.parse(localStorage.getItem('bw-v3-favs')||'[]');const $=s=>document.querySelector(s);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}function save(){localStorage.setItem('bw-v3-selected',JSON.stringify(selected));localStorage.setItem('bw-v3-favs',JSON.stringify(favs))}function selectedQ(n){return selected.includes(n)}function chips(){let q=$('#chips');q.innerHTML='';groups.forEach(g=>{let b=document.createElement('button');b.className='chip'+(g===group?' active':'');b.textContent=g;b.onclick=()=>{group=g;chips();render()};q.append(b)})}function render(){let arr=group==='Tutti'?E:E.filter(x=>x.g===group);$('#title').textContent=group==='Tutti'?'Tutti gli esercizi':group;$('#total').textContent=arr.length+' esercizi';let q=$('#list');q.innerHTML='';arr.forEach(e=>{let row=document.createElement('div');row.className='ex'+(selectedQ(e.n)?' selected':'');let th=document.createElement('button');th.className='thumb';th.onclick=()=>detail(e);if(e.img)th.innerHTML=`<img src="${e.img}" alt="Anteprima ${e.n}">`;else th.innerHTML='<div style="height:100%;display:grid;place-items:center;color:#6d7a86;font-size:12px;padding:8px;text-align:center">demo umana<br>in preparazione</div>';let nb=document.createElement('button');nb.className='namebtn';nb.innerHTML=`<b>${e.n}</b><div class="meta">3 × 10 · ${e.muscle}</div>`;nb.onclick=()=>detail(e);let p=document.createElement('button');p.className='plus'+(selectedQ(e.n)?' selected':'');p.textContent=selectedQ(e.n)?'✓':'+';p.onclick=()=>{selectedQ(e.n)?selected=selected.filter(x=>x!==e.n):selected.push(e.n);save();render()};row.append(th,nb,p);q.append(row)})}function detail(e){current=e;$('#dg').textContent=e.g;$('#dn').textContent=e.n;let v=$('#visual');if(e.loop){v.innerHTML=`<div class="hero"><div class="humanloop"><img src="assets/curl-1.webp"><img src="assets/curl-2.webp"><img src="assets/curl-3.webp"><div class="loopbadge">↻ in loop</div></div><div class="steps"><div class="step">1 · Posizione iniziale</div><div class="step">2 · Salita</div><div class="step">3 · Contrazione</div></div></div>`}else if(e.img){v.innerHTML=`<div class="hero"><img src="${e.img}" style="width:100%;max-height:330px;object-fit:contain;border-radius:15px"><div class="notice">Anteprima umana disponibile. Il loop completo verrà aggiunto nello stesso stile.</div></div>`}else{v.innerHTML='<div class="hero placeholder">Demo umana in preparazione per questo esercizio.</div>'}let steps=e.steps||['Assumi la posizione iniziale mostrata nella demo.','Mantieni il tronco stabile durante il movimento.','Esegui la fase attiva in modo controllato.','Mantieni il controllo nella posizione finale.','Ritorna lentamente alla posizione iniziale.'];let bad=e.bad||['Evita movimenti bruschi o slanci.','Mantieni una traiettoria controllata.','Riduci carico o ampiezza se perdi la tecnica.'];$('#instructions').innerHTML=steps.map(x=>'<li>'+x+'</li>').join('');$('#mistakes').innerHTML=bad.map(x=>'<li>'+x+'</li>').join('');detailButtons();show('detail')}function detailButtons(){let s=selectedQ(current.n);$('#select').textContent=s?'✓ Selezionato':'＋ Aggiungi al mio allenamento';let f=favs.includes(current.n);$('#fav').textContent=f?'★ Preferito':'☆ Preferito'}$('#back').onclick=()=>show('library');$('#select').onclick=()=>{selectedQ(current.n)?selected=selected.filter(x=>x!==current.n):selected.push(current.n);save();detailButtons()};$('#fav').onclick=()=>{favs.includes(current.n)?favs=favs.filter(x=>x!==current.n):favs.push(current.n);save();detailButtons()};$('#simpleBack').onclick=()=>show('library');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.nav==='exercise'){show('library');return}$('#simpleTitle').textContent={home:'Home',workout:'Allenamento',progress:'Progressi',settings:'Impostazioni'}[b.dataset.nav];show('simple')});chips();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
